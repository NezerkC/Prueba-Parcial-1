<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 64" width="320" height="64" fill="none">
  <!-- Definición de gradientes -->
  <defs>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
  </defs>

  <!-- Isotipo: Púa / Pick con ondas de sonido y diapasón estilizado -->
  <g transform="translate(8, 6)">
    <!-- Forma de Púa de Guitarra -->
    <path d="M 26 2 C 40 2, 50 12, 46 28 C 42 42, 26 50, 26 50 C 26 50, 10 42, 6 28 C 2 12, 12 2, 26 2 Z" 
          fill="url(#amberGrad)" />
    <!-- Hueco central / boca de guitarra -->
    <circle cx="26" cy="22" r="10" fill="#0b0f19" />
    <!-- Cuerdas vibrantes / ondas sonoras -->
    <path d="M 20 16 Q 26 20 20 28" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" fill="none" />
    <path d="M 26 14 Q 32 20 26 30" stroke="#f8fafc" stroke-width="2" stroke-linecap="round" fill="none" />
    <path d="M 32 16 Q 38 20 32 28" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" fill="none" />
  </g>

  <!-- Tipografía: SONIDO VIVO -->
  <text x="70" y="34" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="24" font-weight="900" letter-spacing="1.5" fill="#f8fafc">
    SONIDO<tspan fill="#f59e0b">VIVO</tspan>
  </text>
  <!-- Subtítulo institucional -->
  <text x="72" y="49" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="9" font-weight="600" letter-spacing="2.8" fill="#94a3b8">
    INSTRUMENTOS &amp; AUDIO • VIÑA DEL MAR
  </text>
</svg>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Revisá los instrumentos seleccionados en tu carrito de compras de Sonido Vivo. Despacho a todo Chile.">
  <title>Sonido Vivo | Carrito de Compras</title>
  
  <link rel="stylesheet" href="../css/styles.css">
</head>
<body>
      <!-- Cabecera Principal -->
  <header class="main-header">
    <div class="container header-content">
      <a href="../index.html" class="logo" aria-label="Ir al inicio">
        <img src="../assets/img/logo.svg" alt="Sonido Vivo">
      </a>

      <button type="button" class="menu-toggle" aria-label="Abrir menú de navegación">
        <span></span>
        <span></span>
        <span></span>
      </button>

      <nav class="main-nav" aria-label="Navegación principal">
        <ul>
          <li><a href="../index.html">Inicio</a></li>
          <li><a href="productos.html">Catálogo</a></li>
          <li><a href="nosotros.html">Nosotros</a></li>
          <li><a href="blogs.html">Blogs</a></li>
          <li><a href="contacto.html">Contacto</a></li>
        </ul>
      </nav>

      <div class="header-actions">
        <a href="login.html" class="btn btn-secondary btn-sm">Ingresar</a>
        <a href="carrito.html" class="cart-btn" aria-label="Ver carrito">
          <svg class="cart-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>
          <span id="cart-count" class="cart-badge">0</span>
        </a>
      </div>
    </div>
  </header>
  <header class="section-header">
      <h1>Tu Carrito de Compras</h1>
      <p>Los artículos se mantienen guardados en tu navegador de forma segura.</p>
    </header>

    <!-- Estado Vacío (si no hay productos) -->
    <div id="cart-empty-view" class="cart-empty-state" style="display: none;">
      <div class="empty-icon">[ Carrito Vacío ]</div>
      <h2>Tu carrito está vacío</h2>
      <p style="color: var(--color-text-muted); margin: 12px 0 24px;">
        Aún no has agregado ningún instrumento o equipo de audio a tu orden.
      </p>
    </div>

    <!-- Layout con Tabla de Artículos y Resumen Financiero -->
    <div class="cart-layout">    
</body>
